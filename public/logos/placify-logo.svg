<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="placify-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer ring -->
  <path d="M20 4 C29 4 36 11 36 20 C36 29 29 36 20 36" 
        stroke="url(#placify-gradient)" 
        stroke-width="2.5" 
        fill="none" 
        stroke-linecap="round"
        opacity="0.4"/>
  
  <!-- Inner modern P shape -->
  <path d="M14 10 L14 30 M14 10 L22 10 C26 10 28 12 28 16 C28 20 26 22 22 22 L14 22" 
        stroke="url(#placify-gradient)" 
        stroke-width="3" 
        fill="none" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>
  
  <!-- Accent dots -->
  <circle cx="28" cy="16" r="1.5" fill="#3b82f6" opacity="0.8"/>
  <circle cx="18" cy="15" r="1" fill="#a855f7" opacity="0.6"/>
  
  <!-- Energy particles -->
  <circle cx="32" cy="12" r="0.8" fill="#06b6d4" opacity="0.5"/>
  <circle cx="10" cy="25" r="0.8" fill="#7c3aed" opacity="0.5"/>
</svg>
